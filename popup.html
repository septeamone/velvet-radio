<!doctype html>
<html lang="ru" class="no-anim" data-ui="new">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velvet Radio</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="popup-v2.css">
  <link rel="stylesheet" href="ui/ui.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <main class="app">
    <header>
      <h1 class="brand">Velvet Radio</h1>
      <div class="tools">
        <button id="gear" class="icon-btn glass" data-ta="settings" data-tt="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
        <button id="lang" class="icon-btn glass lang-btn" data-ta="language" data-tt="language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.7 5.9 12 3.5Z"/></svg><span id="langLabel">RU</span></button>
        <a id="tg" class="icon-btn glass tg" href="https://t.me/sushtrsx" target="_blank" rel="noopener" data-ta="telegram" data-tt="telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 4.4 3.1 11.3c-.7.3-.7 1.2 0 1.5l4.6 1.6 1.8 5.4c.2.6.9.7 1.3.3l2.5-2.4 4.5 3.3c.5.4 1.3.1 1.4-.6l2.9-14.5c.2-.8-.6-1.4-1.2-1.1Z"/><path d="m8 14.5 9.6-6.3-7.4 7.7"/></svg>
        </a>
        <button id="theme" class="icon-btn glass" data-ta="theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        </button>
      </div>
    </header>

    <div class="searchrow">
      <label class="search glass">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" data-tp="search" autocomplete="off">
      </label>
      <button id="gbtn" class="icon-btn glass gbtn" data-ta="genre" data-tt="genre"><svg viewBox="0 0 24 24"><path d="M4.5 5.5h15l-5.8 7v5.6l-3.4-1.8v-3.8z"/></svg></button>
      <div id="vtoggle" class="vtoggle glass" role="group" hidden>
        <i class="vthumb"></i>
        <button data-view="list" data-ta="viewList" data-tt="viewList"><svg viewBox="0 0 24 24"><path d="M8 6.5h11M8 12h11M8 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg></button>
        <button data-view="tiles" data-ta="viewTiles" data-tt="viewTiles"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
      </div>
    </div>

    <div id="gpanel" class="gpanel glass" hidden></div>

    <nav class="tabs glass" role="tablist">
      <span class="thumb"></span>
      <button role="tab" data-tab="all" class="on"></button>
      <button role="tab" data-tab="fav" data-t="tabFav"></button>
      <button role="tab" data-tab="countries" data-t="tabCountries"></button>
    </nav>

    <div id="cbar" class="cbar glass" hidden>
      <button id="cback" class="cback" data-ta="back" data-tt="back"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>
      <img id="cflag" class="cflag-lg" alt="">
      <span id="cname" class="cname"></span>
      <span id="ccount" class="ccount"></span>
      <button id="chome" class="pill" hidden></button>
    </div>

    <ul id="list" class="list"></ul>
    <button id="locate" class="locate" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6.5 11.5 12 5l5.5 6.5"/></svg><span data-t="jump"></span></button>

    <footer class="player glass">
      <div class="now">
        <div class="logo-wrap"><div id="nowLogo" class="logo idle">♪</div><i id="dot" class="dot" data-st="off"></i></div>
        <div class="now-text">
          <div id="nowTitle" class="now-title" data-t="pick">Выберите станцию</div>
          <div id="subRow" class="sub-row">
            <div id="nowSub" class="now-sub" data-t="pickHint">Нажмите на любую из списка</div>
            <svg class="hint" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          </div>
          <button id="retry" class="retry" data-t="retry"></button>
          <button id="report" class="retry report" data-t="report"></button>
        </div>
        <button id="qbtn" class="qbtn" aria-haspopup="listbox" aria-expanded="false" data-ta="quality" data-tt="qualityTip" hidden><span id="qval"></span><small>kbps</small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button>
        <button id="toggle" class="play" data-ta="playPause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z"/></svg>
        </button>
      </div>
      <div class="vol">
        <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/></svg>
        <input id="vol" type="range" min="0" max="1" step="0.01" data-ta="volume">
      </div>
      <canvas id="viz" class="off" aria-hidden="true"></canvas>
    </footer>

    <section id="settings" class="settings glass" hidden>
      <div class="sethead"><button id="setback" class="cback" data-ta="back"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button><h2 data-t="settings"></h2></div>
      <nav class="setnav" id="setnav" aria-label="Разделы">
        <button data-go="secMain" data-t="navMain" class="on"></button><button data-go="secSound" data-t="navSound"></button><button data-go="secLook" data-t="navLook"></button><button data-go="secData" data-t="navData"></button><button data-go="secMore" data-t="navMore"></button>
      </nav>
      <div class="setbody">
        <h3 class="setsec" id="secMain" data-t="secMain"></h3>
        <div class="setgroup" role="group" aria-labelledby="secMain">
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.7 5.9 12 3.5Z"/></svg></span><span class="st"><b data-t="sHome"></b><small data-t="sHomeD"></small></span><button id="homeBtn" class="pill sel" aria-haspopup="listbox" aria-expanded="false" data-ta="sHome"><img id="homeFlag" class="hflag" alt=""><span id="homeName"></span><svg class="hchev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button></div>
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.9v6.2l5-3.1Z"/></svg></span><span class="st"><b data-t="sResume"></b><small data-t="sResumeD"></small></span><input type="checkbox" class="sw" data-set="resume"></label>
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13.5 14-14.5 0 9-5 14.5-13 14.5"/><path d="M5 19 12.5 11.5"/></svg></span><span class="st"><b data-t="sSaver"></b><small data-t="sSaverD"></small></span><input type="checkbox" class="sw" data-set="saver"></label>
        </div>
        <h3 class="setsec" id="secSound" data-t="secSound"></h3>
        <div class="setgroup" role="group" aria-labelledby="secSound">
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg></span><span class="st"><b data-t="sFade"></b><small data-t="sFadeD"></small></span><input type="checkbox" class="sw" data-set="fade"></label>
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6v5.5c0 4.2 3 7.2 7 9 4-1.8 7-4.8 7-9V6l-7-2.5Z"/><path d="m9 12 2.2 2.2L15 10"/></svg></span><span class="st"><b data-t="sBuffer"></b><small data-t="sBufferD"></small></span><div id="bufseg" class="seg" style="--n:3"><i class="seg-thumb"></i><button data-k="4" data-t="sBufFast" data-tt="sBufFastT"></button><button data-k="9" data-t="sBufBal" data-tt="sBufBalT"></button><button data-k="14" data-t="sBufSafe" data-tt="sBufSafeT"></button></div></div>
        </div>
        <h3 class="setsec" id="secLook" data-t="secLook"></h3>
        <div class="setgroup" role="group" aria-labelledby="secLook">
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h1.5M8.5 8v8M12 5v14M15.5 8v8M18.5 12H20"/></svg></span><span class="st"><b data-t="sViz"></b><small data-t="sVizD"></small></span><input type="checkbox" class="sw" data-set="showViz"></label>
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4Z"/><path d="M4 9h16"/></svg></span><span class="st"><b data-t="sClassic"></b><small data-t="sClassicD"></small></span><input type="checkbox" class="sw" data-set="classic"></label>
        </div>
        <h3 class="setsec" id="secData" data-t="secData"></h3>
        <div class="setgroup" role="group" aria-labelledby="secData">
        <label class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 18.5A4.5 4.5 0 0 1 7 9.6a5.5 5.5 0 0 1 10.6 1.4 3.8 3.8 0 0 1-.6 7.5Z"/></svg></span><span class="st"><b data-t="sSync"></b><small data-t="sSyncD"></small></span><input type="checkbox" class="sw" data-set="sync"></label>
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z"/><path d="M14 3.5v4h4"/><path d="M9.5 14l2.5 2.5 2.5-2.5M12 11.5v5"/></svg></span><span class="st"><b data-t="sBackup"></b><small data-t="sBackupD"></small></span><div class="btns"><button id="bexp" class="pill" data-t="sExport"></button><button id="bimp" class="pill" data-t="sImport"></button><input type="file" id="bfile" accept="application/json,.json" hidden></div></div>
        <div class="set col"><span class="sico" id="checkIco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7.5"/></svg></span><span class="st"><b data-t="sCheck"></b><small id="checkInfo"></small></span><button id="bcheck" class="pill" data-t="sCheckBtn"></button><ul id="badlist" class="badlist"></ul></div>
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4.5 4.5v3.8h3.8"/></svg></span><span class="st"><b data-t="sReset"></b><small data-t="sResetD"></small></span><button id="breset" class="pill" data-t="sResetBtn"></button></div>
        </div>
        <h3 class="setsec" id="secMore" data-t="secMore"></h3>
        <div class="setgroup" role="group" aria-labelledby="secMore">
        <div class="set keys"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><path d="M7 10.5h.01M10 10.5h.01M13 10.5h.01M16 10.5h.01M8 14h8"/></svg></span><span class="st"><b data-t="sKeys"></b><small data-t="sKeysD"></small></span><button id="bkeys" class="pill" data-t="sKeysBtn"></button><div id="keyList" class="keylist"></div></div>
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4 1.9 5.1L18 11l-5.1 1.9L11 18l-1.9-5.1L4 11l5.1-1.9Z"/><path d="M18.5 15.5v4M16.5 17.5h4"/></svg></span><span class="st"><b data-t="sNew"></b><small id="newInfo"></small></span><button id="bnew" class="pill" data-t="sNewBtn"></button></div>
        <div class="set"><span class="sico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8Z"/></svg></span><span class="st"><b data-t="sTour"></b><small data-t="sTourD"></small></span><button id="btour" class="pill" data-t="sTourBtn"></button></div>
        </div>
        <div class="about"><span id="ver"></span> · <a href="https://github.com/septeamone/velvet-radio" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/septeamone/velvet-radio/blob/main/PRIVACY.md" target="_blank" rel="noopener" data-t="sPrivacy"></a></div>
      </div>
    </section>
  </main>

  <div id="homeWrap" class="homewrap" hidden><ul id="homeMenu" class="homemenu" role="listbox" data-ta="sHome"></ul></div>
  <div id="qWrap" class="homewrap qwrap" hidden><ul id="qMenu" class="homemenu" role="listbox" data-ta="quality"></ul></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
